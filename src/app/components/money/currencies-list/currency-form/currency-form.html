<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Currency' : 'Add New Currency' }}</div>

<div class="flex flex-col gap-4">
  <div class="flex gap-4">
    <v-input class="flex-1"
             label="Title"
             placeholder="US Dollar"
             [ngModel]="title$$()"
             (ngModelChange)="title$$.set($event)" />

    <v-input class="flex-1"
             label="Ticker"
             placeholder="USD"
             [ngModel]="ticker$$()"
             (ngModelChange)="ticker$$.set($event)" />
  </div>

  <div class="flex gap-4">
    <v-input class="flex-1"
             label="Symbol"
             placeholder="$"
             [ngModel]="symbol$$()"
             (ngModelChange)="symbol$$.set($event)" />

    <v-dropdown class="flex-1"
                [label]="'Symbol Position'"
                [placeholder]="'Select position'"
                [items]="symbolPositionItems()"
                [ngModel]="symbolPosEnum$$()"
                (ngModelChange)="symbolPosEnum$$.set($event)"></v-dropdown>
  </div>

  <v-checkbox [value]="whitespace$$()"
              (valueChange)="whitespace$$.set($event)">
    Whitespace between symbol and amount
  </v-checkbox>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [isDisabled]="!title$$() || !ticker$$() || !symbol$$()"
              (onClick)="save()">
      {{ isEditing() ? 'Update' : 'Create' }}
    </v-button>

    <v-button surface="flat"
              (onClick)="cancel()">
      Cancel
    </v-button>
  </div>
</div>

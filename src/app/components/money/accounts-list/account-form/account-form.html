<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Account' : 'Add New Account' }}</div>

<div class="flex flex-col gap-4">
  <div class="flex gap-4">
    <v-input class="flex-1"
             label="Title"
             placeholder="My Bank Account"
             [(value)]="title$$" />

    <v-dropdown class="flex-1"
                [label]="'Organization'"
                [placeholder]="'None'"
                [items]="organizationItems()"
                [(value)]="organizationId$$"></v-dropdown>
  </div>

  <div class="flex gap-4">
    <v-dropdown class="flex-1"
                [label]="'Currency'"
                [placeholder]="'Select currency'"
                [items]="currencyItems()"
                [isRequired]="true"
                [(value)]="currencyId$$"></v-dropdown>

    <v-dropdown class="flex-1"
                [label]="'Account Type'"
                [placeholder]="'Select type'"
                [items]="kindItems()"
                [isRequired]="true"
                [(value)]="kind$$"></v-dropdown>
  </div>

  <v-checkbox [value]="isInvest$$()"
              (valueChange)="isInvest$$.set($event)">
    Investment account
  </v-checkbox>

  <v-checkbox [value]="isArchived$$()"
              (valueChange)="isArchived$$.set($event)">
    Archived account
  </v-checkbox>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [isDisabled]="!isFormValid()"
              (clickOutput)="save()">
      {{ isEditing() ? 'Update' : 'Create' }}
    </v-button>

    <v-button surface="flat"
              (clickOutput)="cancel()">
      Cancel
    </v-button>
  </div>
</div>

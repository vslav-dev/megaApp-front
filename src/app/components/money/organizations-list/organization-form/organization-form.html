<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Organization' : 'Add New Organization' }}</div>

<div class="flex flex-col gap-4">
  <v-input label="Title"
           placeholder="Sberbank"
           [ngModel]="title$$()"
           (ngModelChange)="title$$.set($event)" />

  <div class="flex flex-col gap-2">
    <div class="opacity-70 text-sm">Logo</div>

    <div class="flex items-center gap-3">
      @if (getLogoSrc(); as src) {
        <img [src]="src"
             class="w-10 h-10 rounded object-contain border border-[color:var(--v-outline-color)]"
             alt="">

        <v-button surface="flat"
                  [paddingX]="2"
                  [paddingY]="1"
                  (onClick)="clearLogo()">
          Remove
        </v-button>

        <v-button surface="flat"
                  [paddingX]="2"
                  [paddingY]="1"
                  (onClick)="triggerFileInput()">
          Replace
        </v-button>
      } @else {
        <div class="w-10 h-10 rounded border border-dashed border-[color:var(--v-outline-color)] opacity-40"></div>

        <v-button surface="flat"
                  [paddingX]="2"
                  [paddingY]="1"
                  (onClick)="triggerFileInput()">
          Upload image
        </v-button>
      }

      <input #fileInput
             type="file"
             accept="image/*"
             class="sr-only"
             (change)="onFileSelected($event)">
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [isDisabled]="!isFormValid()"
              (onClick)="save()">
      {{ isEditing() ? 'Update' : 'Create' }}
    </v-button>

    <v-button surface="flat"
              (onClick)="cancel()">
      Cancel
    </v-button>
  </div>
</div>

<div class="flex flex-col gap-4">
  <div class="flex gap-4">
    <v-progress class="w-1/2"
                [value]="proteinBar$$().value"
                [barColor]="proteinBar$$().barColor">
      <div v-label
           class="flex justify-between gap-2">
        <span>Белки</span>
        <span>{{ proteinPercentFormatted$$() }}</span>
      </div>
    </v-progress>

    <v-progress class="w-1/2"
                [value]="fatBar$$().value"
                [barColor]="fatBar$$().barColor">
      <div v-label
           class="flex justify-between gap-2">
        <span>Жиры</span>
        <span>{{ fatPercentFormatted$$() }}</span>
      </div>
    </v-progress>
  </div>

  <div class="flex gap-4">
    <v-progress class="w-1/2"
                [value]="carbsBar$$().value"
                [barColor]="carbsBar$$().barColor">
      <div v-label
           class="flex justify-between gap-2">
        <span>Углеводы</span>
        <span>{{ carbsPercentFormatted$$() }}</span>
      </div>
    </v-progress>

    <v-progress class="w-1/2"
                [value]="fiberBar$$().value"
                [barColor]="fiberBar$$().barColor">
      <div v-label
           class="flex justify-between gap-2">
        <span>Клетчатка</span>
        <span>{{ fiberPercentFormatted$$() }}</span>
      </div>
    </v-progress>
  </div>
</div>

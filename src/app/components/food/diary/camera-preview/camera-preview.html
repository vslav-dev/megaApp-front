<div class="flex flex-col h-[100dvh] w-full relative bg-black rounded-none overflow-hidden">

  @if (error$$()) {

    <div class="background-black flex flex-col justify-end h-full p-4 text-xl text-center">
      <p class="text-red-500">{{ error$$() }}</p>

      <p class="mb-4 text-white">Попробовать снова?</p>

      <div class="flex justify-center w-full gap-2">
        <v-button class="v-danger mr-auto"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (click)="cancel()">
          <v-icon v-prefix
                  [name]="Icon.Close"
                  [size]="10" />
        </v-button>

        <v-button class="v-primary"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (click)="startCamera()">
          <v-icon v-prefix
                  [name]="Icon.Refresh"
                  [size]="10" />
        </v-button>
      </div>
    </div>

  } @else if (hasPhoto$$()) {

    <div class="flex h-full">
      <img class="background-black flex object-contain"
           [src]="photoDataUrl$$()" />

      <div class="absolute bottom-0 flex justify-center w-full gap-4 p-4">
        <v-button class="v-danger mr-auto"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (click)="cancel()">
          <v-icon v-prefix
                  [name]="Icon.Close"
                  [size]="10" />
        </v-button>

        <v-button class="v-primary"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (click)="retakePhoto()">
          <v-icon v-prefix
                  [name]="Icon.Refresh"
                  [size]="10" />
        </v-button>

        <v-button class="v-primary"
                  [isDisabled]="isConfirmPhotoTemporarilyDisabled$$()"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (onClick)="confirmPhoto()">
          <v-icon v-prefix
                  [name]="Icon.Check"
                  [size]="10" />
        </v-button>
      </div>
    </div>

  } @else {

    <div class="relative flex flex-col h-full">
      @if (isLoading$$()) {
        <div class="bg-black/70 absolute inset-0 z-10 flex flex-col items-center justify-center text-white">
          <v-icon class="animate-spin"
                  [name]="Icon.Cached"
                  [size]="10" />
          <p>Подключение к камере...</p>
        </div>
      }

      <video #video
             autoplay
             playsinline
             muted
             class="w-full h-full">
      </video>

      <canvas #canvas
              class="hidden"></canvas>

      <div class="absolute bottom-0 flex items-center w-full p-4">
        <v-button class="v-danger mr-auto"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (click)="cancel()">
          <v-icon v-prefix
                  [name]="Icon.Close"
                  [size]="10" />
        </v-button>

        <v-button class="v-primary"
                  [isDisabled]="isLoading$$()"
                  [isLabelHidden]="true"
                  [padding]="2"
                  (click)="takePhoto()">
          <v-icon v-prefix
                  [name]="Icon.PhotoCamera"
                  [size]="10" />
        </v-button>
      </div>
    </div>

  }

</div>

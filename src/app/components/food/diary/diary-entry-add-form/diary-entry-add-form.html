@if (foodAddModalService.selectedProduct$$(); as product) {
  @if (foodCatalogueService.getCornerImageUrl(product.id); as cornerImageUrl) {
    <img v-corner-pic
         [src]="cornerImageUrl"
         class="absolute top-[-3px] left-[-3px] w-[230px] h-[230px] pointer-events-none z-[-1]">
  }
}

<form [formGroup]="diaryEntryForm"
      (ngSubmit)="submitForm()">
  <div class="flex flex-col items-end gap-0 p-4">
    <div class="flex items-center justify-center mb-2">
      <div class="text-end flex-grow mr-2 text-xl font-medium">
        <span class="readable-text-bg py-[1px] px-[6px]">
          {{ foodAddModalService.selectedProduct$$()?.name }}
          @if (isProductArchived$$()) {
            <span class="ml-1 text-sm font-normal text-[color:var(--v-color-text-muted)]">архив</span>
          }
        </span>
      </div>

      <v-button class="self-start"
                surface="raised"
                [isLabelHidden]="true"
                [padding]="2"
                (click)="editProduct()">
        <v-icon v-prefix
                [name]="Icon.Edit"
                [size]="7" />
      </v-button>
    </div>

    <div class="readable-text-bg w-fit flex gap-2 mb-1 mr-1 text-xl">
      <ui-progress-icon circleStyle
                        class="place-content-end w-1/3 text-right"
                        [progressNum]="projectedSelectedDaysConsumedPercentNum$$()"
                        [diameter]="24" />

      <span class="w-2/3 font-bold text-left">
        <v-rolling-number [textInput]="projectedSelectedDaysConsumedPercentDisplay$$()" />
      </span>
    </div>

    <div class="w-[114.45px] mb-4"> <!-- 114.45px is width of a button below -->
      <div class="relative">
        <v-input [formControl]="foodWeightControl"
                 inputmode="numeric"
                 label="Вес"
                 fontSize="20px"
                 [fontWeight]="500"
                 textAlign="right"
                 (onInputChanged)="onFoodWeightInput()">
          <span v-postfix
                class="ml-1 mr-3">г.</span>
        </v-input>
      </div>
    </div>

    <div class="flex justify-end gap-4">
      <v-button class="v-primary"
                [isLabelHidden]="true"
                [padding]="1"
                (click)="goBack()">
        <v-icon v-prefix
                [name]="Icon.ChevronLeft"
                [size]="9" />
      </v-button>

      <v-button class="v-primary"
                type="submit"
                [isDisabled]="!isFormValid() || isProductArchived$$()">
        Добавить
      </v-button>
    </div>
  </div>
</form>

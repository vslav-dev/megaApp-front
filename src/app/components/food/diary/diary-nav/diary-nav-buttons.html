<div class="flex w-full gap-3">
  @if(deviceInfoService.isDesktopScreen$$()) {
    <v-button surface="flat"
              [isLabelHidden]="true"
              [padding]="1"
              (onClick)="goToPreviousDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowLeft"
              [size]="7" />
    </v-button>
  }

  <div class="v-theme-transition grow flex justify-between gap-2 overflow-hidden text-xl"
       [class.mx-2]="deviceInfoService.isMobileScreen$$()"
       [style.color]="!isTodaySelected$$() ? 'var(--v-color-primary)' : null">
    <div class="place-content-center whitespace-nowrap overflow-hidden"
         fitTextOnOverflow
         [fullText]="weekdayFull$$()"
         [shortText]="weekdayShort$$()"></div>
    <div class="place-content-center whitespace-nowrap">{{ dateFormatted$$() }}</div>
  </div>

  @if(deviceInfoService.isDesktopScreen$$()) {
    <div class="flex flex-col">
      <v-button surface="flat"
                [isLabelHidden]="true"
                [padding]="2"
                (onClick)="onDateControlClick()">
        <v-icon v-prefix
                [name]="primaryActionIcon$$()"
                [size]="5"
                [class.-scale-x-100]="isPastDaySelected$$()" />
      </v-button>

      <ng-container [ngTemplateOutlet]="dateInputTemplate" />
    </div>

    <v-button surface="flat"
              [isLabelHidden]="true"
              [padding]="1"
              (onClick)="goToNextDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowRight"
              [size]="7" />
    </v-button>
  }
</div>

@if (authService.isAuthenticated$$() && !deviceInfoService.isDesktopScreen$$()) {
  @if (!isAnyAccordionOpen$$()) {
    <div [class]="deviceInfoService.shouldHideFabButtons$$() ? 'fab-hide-slide-right-hidden' : 'fab-hide-slide-right-visible'"
         class="fixed right-0 z-20 mr-4"
         [style.bottom]="addFabBottomPx">
      <v-button class="v-primary"
                surface="raised"
                [isLabelHidden]="true"
                [borderRadius]="7"
                [padding]="3"
                (onClick)="openAddFoodModal()">
        <v-icon v-prefix
                [name]="Icon.Add"
                [size]="8" />
      </v-button>
    </div>
  }

  <div [class]="deviceInfoService.shouldHideFabButtons$$() ? 'fab-hide-slide-down-hidden' : 'fab-hide-slide-down-visible'"
       class="bottom-4 fixed flex gap-5"
       [style.right]="dateNavRowRightPx"
       style="z-index: 10">
    <v-button surface="raised"
              [isLabelHidden]="true"
              [borderRadius]="7"
              [padding]="3"
              (onClick)="onDateControlClick()">
      <v-icon v-prefix
              [name]="primaryActionIcon$$()"
              [size]="8"
              [class.-scale-x-100]="isPastDaySelected$$()" />
    </v-button>

    <v-button surface="raised"
              [isLabelHidden]="true"
              [borderRadius]="7"
              [padding]="2"
              (onClick)="goToPreviousDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowLeft"
              [size]="10" />
    </v-button>

    <v-button surface="raised"
              [isLabelHidden]="true"
              [borderRadius]="7"
              [padding]="2"
              (onClick)="goToNextDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowRight"
              [size]="10" />
    </v-button>
  </div>

  <ng-container [ngTemplateOutlet]="dateInputTemplate" />
}

<ng-template #dateInputTemplate>
  <input #dateInputElem
         id="date-picker-input"
         type="date"
         class="hide-input"
         [formControl]="formCalendarSelectedDay"
         [max]="maxDateIso$$()"
         (change)="onDatePicked($event)" />
</ng-template>

<div class="group inline-flex items-center gap-1">
  <div class="text-lg font-semibold">{{ titleInput() }}</div>
  <v-button class="group-hover:opacity-100 focus-within:opacity-100 opacity-0 transition-opacity"
            surface="flat"
            [isLabelHidden]="true"
            [padding]="1"
            (clickOutput)="openSettings()">
    <v-icon v-prefix
            [name]="Icon.Settings"
            [size]="4"></v-icon>
  </v-button>
</div>

<v-modal [deviceType]="deviceInfoService.isMobileScreen$$() ? 'mobile' : 'desktop'"
         [isOpen]="isModalOpen$$()"
         mobileWidth="min(100vw, 360px)"
         desktopWidth="360px"
         [borderRadius]="3"
         [padding]="4"
         (closeOutput)="cancel()">
  <div class="flex flex-col gap-4">
    <div class="text-xl font-medium text-center">{{ titleInput() }}</div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between text-sm">
        <span>Height</span>
        <span>{{ draftHeightPx$$() }}px</span>
      </div>
      <v-slider [min]="minHeightPxInput()"
                [max]="maxHeightPxInput()"
                [value]="draftHeightPx$$()"
                (valueChange)="onSliderChange($event)" />
    </div>

    <div class="flex justify-end gap-2">
      <v-button class="v-primary"
                (clickOutput)="save()">
        Save
      </v-button>

      <v-button surface="flat"
                (clickOutput)="cancel()">
        Cancel
      </v-button>
    </div>
  </div>
</v-modal>

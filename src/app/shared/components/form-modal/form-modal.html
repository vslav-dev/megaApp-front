<v-modal [deviceType]="deviceInfoService.isMobileScreen$$() ? 'mobile' : 'desktop'"
         [isOpen]="isModalOpen()"
         [isCloseButtonVisible]="false"
         [isBackdropDimmed]="isBackdropDimmed()"
         mobileWidth="min(100vw, 520px)"
         desktopWidth="520px"
         [borderRadius]="3"
         [padding]="4"
         (onClose)="onClose()">
  <ng-content />
</v-modal>

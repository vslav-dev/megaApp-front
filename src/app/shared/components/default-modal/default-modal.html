<v-modal [deviceType]="deviceInfoService.isMobileScreen$$() ? 'mobile' : 'desktop'"
         [isOpen]="isModalOpen()"
         mobileWidth="min(100vw, 360px)"
         desktopWidth="360px"
         [borderRadius]="3"
         [padding]="4"
         (closeOutput)="onClose()">
  <div class="flex flex-col gap-4">
    @if (modalTitle()) {
      <div class="text-xl font-medium text-center">
        {{ modalTitle() }}
      </div>
    }

    @if (modalMessage()) {
      <div class="opacity-70 text-sm text-center">
        {{ modalMessage() }}
      </div>
    }

    <div class="flex flex-wrap gap-4">
      <v-button class="flex-auto"
                surface="flat"
                (clickOutput)="onCancel()">
        {{ cancelButtonLabel() }}
      </v-button>

      <v-button class="v-danger flex-auto"
                (clickOutput)="onConfirm()">
        {{ confirmButtonLabel() }}
      </v-button>
    </div>
  </div>
</v-modal>
